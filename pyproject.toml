[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lebanon-website-discovery"
version = "0.1.0"
description = "Resumable source-aware website discovery prototype"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy==2.0.48",
  "httpx==0.28.1",
  "pydantic==2.9.2",
  "typer==0.25.1",
  "tldextract==5.3.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
postgres = ["psycopg[binary]>=3.2,<4"]
osm-extract = ["osmium==4.3.1"]
geography = ["shapely==2.1.2", "pyproj==3.7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
